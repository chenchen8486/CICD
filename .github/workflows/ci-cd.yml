# 工作流名称会显示在仓库的 Actions 页面。
name: CI/CD 实战

# 这些事件会让 GitHub 启动工作流。
on:
  push:
    # main 分支收到新提交时运行，例如 PR 合并后。
    branches: [main]
    # 推送 v0.1.0、v1.0.0 等标签时也会运行。
    tags: ["v*"]
  # 创建 PR 或向 PR 源分支追加提交时运行，用于合并前检查。
  pull_request:
  # 允许在 Actions 页面点击 Run workflow 手动运行。
  workflow_dispatch:

# 默认只读仓库内容，发布任务会单独申请写权限。
permissions:
  contents: read

jobs:
  test-and-build:
    name: 测试并构建
    # 使用 GitHub 提供的全新 Ubuntu 虚拟机。
    runs-on: ubuntu-latest

    steps:
      # 把当前提交对应的仓库代码下载到运行器。
      - name: 检出代码
        uses: actions/checkout@v7

      # 固定 Python 大版本，避免不同机器的默认版本不一致。
      - name: 准备 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # 与本地完全相同的测试命令；任何测试失败都会让任务失败。
      - name: 运行单元测试
        working-directory: demo
        run: python -m unittest discover -s tests -v

      # zipapp 把 app 目录打成单个可执行 Python 文件。
      - name: 构建可运行产物
        run: python -m zipapp demo/app -m "main:main" -o calculator.pyz

      # 不只检查文件是否生成，还实际运行它并核对输出。
      - name: 验证构建产物
        run: |
          output=$(python calculator.pyz 2 3)
          test "$output" = "5"

      # 上传构建结果，可在本次工作流摘要页面下载。
      - name: 保存构建产物
        uses: actions/upload-artifact@v7
        with:
          name: calculator
          path: calculator.pyz
          retention-days: 7

  release:
    name: 发布 Release
    # 只有推送 v* 标签才发布，普通提交和 PR 会跳过这个任务。
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    # 测试或构建失败时不会执行发布。
    needs: test-and-build
    runs-on: ubuntu-latest
    # 创建 Release 需要写权限，不影响其他任务的只读权限。
    permissions:
      contents: write

    steps:
      # 下载上个任务测试过的产物，不重新构建另一份文件。
      - name: 下载已验证的产物
        uses: actions/download-artifact@v8
        with:
          name: calculator

      # GitHub 运行器已预装 gh；令牌负责认证，GH_REPO 指定目标仓库。
      - name: 创建版本发布页
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: >-
          gh release create "$TAG_NAME" calculator.pyz
          --title "计算器 $TAG_NAME"
          --generate-notes
